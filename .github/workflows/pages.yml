# Deploys the static site to GitHub Pages on every push to the listed branches.
# The configure-pages step tries to enable Pages for the repository on first run.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/webpage-alignment-vision-2n0glb
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
